# Local stack for development and for CI.
#
#   docker compose up -d                    MariaDB, Redis, Gotenberg, an S3 stand-in
#   docker compose --profile server up -d   the same, plus the server built from this tree
#
# Host ports are set high so they do not collide with other local stacks.
# Override any of them from the environment.

name: ledger

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-11.8}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=500
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${SYSTEM_DB_NAME:-bigcapital_system}
    volumes:
      - mariadb:/var/lib/mysql
    ports:
      - '127.0.0.1:${MARIADB_HOST_PORT:-33306}:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-36379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # A second Redis for test runs. Every process on one Redis shares the job
  # queues, so tests get their own and cannot take a running server's jobs.
  redis-test:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${REDIS_TEST_HOST_PORT:-36380}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: gotenberg/gotenberg:7
    # The converter fetches the page to print from the server. When the server
    # runs on the host (scripts/local-up.sh) it reaches it by this name.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '127.0.0.1:${GOTENBERG_HOST_PORT:-39100}:3000'

  # An S3-compatible store for local runs and CI. It accepts any credentials
  # and does not check signatures: a stand-in, not a deployment option.
  s3:
    image: adobe/s3mock:${S3MOCK_VERSION:-latest}
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-ledger}
    ports:
      - '127.0.0.1:${S3_HOST_PORT:-39000}:9090'

  server:
    profiles: ['server']
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      SYSTEM_DB_NAME: ${SYSTEM_DB_NAME:-bigcapital_system}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_HOST: redis
      QUEUE_PORT: 6379
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-dev-jwt-secret}
      BASE_URL: http://localhost:${SERVER_HOST_PORT:-13000}
      SIGNUP_DISABLED: 'false'
      SIGNUP_EMAIL_CONFIRMATION: 'false'
      GOTENBERG_URL: http://gotenberg:3000
      GOTENBERG_DOCS_URL: http://server:3000/public/
      S3_REGION: us-east-1
      S3_ENDPOINT: http://s3:9090
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ledger-local}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-ledger-local-secret}
      S3_BUCKET: ${S3_BUCKET:-ledger}
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '127.0.0.1:${SERVER_HOST_PORT:-13000}:3000'

volumes:
  mariadb:
